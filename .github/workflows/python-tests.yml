name: Python Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run scene alignment tests
      run: |
        python _test_scene_contract.py

    - name: Run episode flow tests
      run: |
        python _test_episode_flow.py

    - name: Run network resilience tests
      run: |
        python _test_network_resilience.py

    - name: Run smoke tests
      run: |
        python _smoke_story_import.py

    - name: Run end-to-end tests
      run: |
        python _e2e_verify.py